name = "aeroquery-api"
main = "src/worker.py"
compatibility_date = "2026-11-11"
compatibility_flags = ["python_workers"]
workers_dev = true

[observability]
enabled = true

[vars]
QUESTIONS_RETENTION_DAYS = "30"
QUESTIONS_LOG_QUERY_TEXT = "true"
CACHE_TTL_SECONDS = "86400"

[secrets]
required = [
	"API_WORKER_KEY",
	"AZURE_OPENAI_API_KEY",
	"AZURE_OPENAI_ENDPOINT",
	"PINECONE_API_KEY",
	"PINECONE_INDEX_HOST",
	"COHERE_API_KEY",
]

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__"]

[[d1_databases]]
binding = "DB"
database_name = "aeroquery-questions"
database_id = "d5f0ccd1-8eff-48b7-80de-0a610e7c4a19"
migrations_dir = "schema"

[[kv_namespaces]]
binding = "AEROQUERY_ANSWER_CACHE"
id = "8cdd000835094598a3601ac190a6b50a"

[triggers]
crons = ["0 3 * * *"]

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "913847210"

	[ratelimits.simple]
	limit = 30
	period = 60